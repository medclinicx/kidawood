<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Weather radar with no stock listing</title>
  <desc id="d">A radar sweep over a simple map, next to a flat chart line ending in a question mark.</desc>
  <rect width="1200" height="675" fill="#eef3f8"/>
  <rect x="70" y="90" width="620" height="495" rx="18" fill="#ffffff" stroke="#d9e2ea" stroke-width="3"/>
  <path d="M130 200 H630 M130 320 H630 M130 440 H630 M230 130 V545 M370 130 V545 M510 130 V545" stroke="#d9e2ea" stroke-width="3"/>
  <circle cx="370" cy="330" r="52" fill="#0e7a5f"/>
  <path d="M370 330 L560 180 A235 235 0 0 1 600 300 Z" fill="#0e7a5f" opacity="0.28"/>
  <circle cx="370" cy="330" r="110" fill="none" stroke="#0f2a4a" stroke-width="4" opacity="0.55"/>
  <circle cx="370" cy="330" r="180" fill="none" stroke="#0f2a4a" stroke-width="4" opacity="0.3"/>
  <circle cx="470" cy="255" r="14" fill="#0f2a4a"/>
  <circle cx="285" cy="420" r="14" fill="#0f2a4a" opacity="0.7"/>
  <rect x="740" y="150" width="390" height="260" rx="18" fill="#ffffff" stroke="#d9e2ea" stroke-width="3"/>
  <path d="M790 340 H1080" stroke="#0f2a4a" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16"/>
  <circle cx="790" cy="340" r="10" fill="#0e7a5f"/>
  <circle cx="1080" cy="340" r="10" fill="#0e7a5f"/>
  <text x="935" y="290" font-family="Arial, sans-serif" font-size="110" font-weight="bold" fill="#0f2a4a" text-anchor="middle">?</text>
  <text x="935" y="480" font-family="Arial, sans-serif" font-size="34" fill="#24486e" text-anchor="middle">No stock symbol</text>
  <text x="935" y="525" font-family="Arial, sans-serif" font-size="24" fill="#5b6b78" text-anchor="middle">Private company</text>
</svg>
