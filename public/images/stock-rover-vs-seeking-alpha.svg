<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Two research tools side by side</title>
  <desc id="d">Two panels side by side: one shows a stock screening table with metric columns, the other shows an analyst article with a rating badge.</desc>
  <rect width="1200" height="675" fill="#eef3f8"/>
  <rect x="70" y="80" width="500" height="470" rx="18" fill="#ffffff" stroke="#d9e2ea" stroke-width="3"/>
  <rect x="630" y="80" width="500" height="470" rx="18" fill="#ffffff" stroke="#d9e2ea" stroke-width="3"/>
  <rect x="100" y="110" width="440" height="54" rx="10" fill="#0f2a4a"/>
  <text x="320" y="146" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Screening by the numbers</text>
  <rect x="660" y="110" width="440" height="54" rx="10" fill="#0e7a5f"/>
  <text x="880" y="146" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Analysis in writing</text>
  <path d="M100 200 H540 M100 260 H540 M100 320 H540 M100 380 H540" stroke="#d9e2ea" stroke-width="3"/>
  <rect x="120" y="212" width="150" height="26" rx="6" fill="#0f2a4a"/>
  <rect x="300" y="212" width="90" height="26" rx="6" fill="#cfe0ee"/>
  <rect x="420" y="212" width="90" height="26" rx="6" fill="#cfe0ee"/>
  <rect x="120" y="272" width="150" height="26" rx="6" fill="#0f2a4a"/>
  <rect x="300" y="272" width="90" height="26" rx="6" fill="#cfe0ee"/>
  <rect x="420" y="272" width="90" height="26" rx="6" fill="#cfe0ee"/>
  <rect x="120" y="332" width="150" height="26" rx="6" fill="#0f2a4a"/>
  <rect x="300" y="332" width="90" height="26" rx="6" fill="#cfe0ee"/>
  <rect x="420" y="332" width="90" height="26" rx="6" fill="#cfe0ee"/>
  <path d="M120 470 L220 430 L320 450 L420 400 L510 380" fill="none" stroke="#0e7a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="880" cy="230" r="52" fill="#fdf8ec" stroke="#c9a227" stroke-width="5"/>
  <text x="880" y="242" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0f2a4a" text-anchor="middle">Buy</text>
  <path d="M700 320 H1030 M700 360 H1030 M700 400 H960" stroke="#d9e2ea" stroke-width="14" stroke-linecap="round"/>
  <path d="M700 450 H1030" stroke="#0e7a5f" stroke-width="14" stroke-linecap="round"/>
  <text x="320" y="620" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f2a4a" text-anchor="middle">Stock Rover</text>
  <text x="880" y="620" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f2a4a" text-anchor="middle">Seeking Alpha</text>
</svg>
